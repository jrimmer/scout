# Create the Slack app from this manifest: api.slack.com/apps → Create New App → From a manifest.
# Then: Basic Information → App-Level Tokens → generate one with `connections:write` (SLACK_APP_TOKEN),
# and Install App → copy the Bot User OAuth Token (SLACK_BOT_TOKEN).
display_information:
  name: Scout
  description: A teammate who writes code in public channels.
  background_color: "#2f3b4c"
features:
  bot_user:
    display_name: Scout
    always_online: true
  app_home:
    home_tab_enabled: true # what Scout is doing, your threads, what's waiting on you
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
  shortcuts:
    - name: Ask Scout about this
      type: message
      callback_id: scout_ask
      description: Start a Scout thread on this message
  slash_commands:
    - command: /scout
      description: What Scout is doing, schedules, what's waiting on you, or ask it something
      usage_hint: status | schedules | waiting | ask <request>
      should_escape: false
  # Link previews for pull requests and issues on the code host: replace with your code host's domain(s).
  unfurl_domains:
    - code.example.com
oauth_config:
  scopes:
    bot:
      - channels:history # follow threads in public channels
      - channels:read # channel names, for channel profiles
      - channels:manage # create a public channel when someone DMs Scout
      - chat:write
      - commands # the "Ask Scout about this" message shortcut, and /scout
      - reactions:write # 👀/✅/⚠️ on requests
      - links:read # see code host links pasted in channels
      - links:write # and preview them
      - canvases:write # each channel's Scout canvas
      - lists:read
      - lists:write # the list of Scout's work
      - files:read # screenshots and logs people share in threads
      - files:write # a long answer, attached in full
      - groups:history # see mentions in private channels, to decline them
      - im:history # see DMs, to decline them
      - mpim:history
      - reactions:read # a stop sign reaction stops Scout's work
      - users:read # display names
      - users:read.email # who someone is in the identity provider (SCOUT_DIRECTORY), for permissions and roles
      - usergroups:read # only if SCOUT_ALLOWED_USERGROUP limits who may ask for work
# The Ask Scout step in Workflow Builder (paid plans): starts a Scout thread in a channel with a request.
functions:
  ask_scout:
    title: Ask Scout
    description: Start a Scout thread in a public channel with a request
    input_parameters:
      channel_id:
        type: slack#/types/channel_id
        title: Channel
        description: A public channel Scout is in
        is_required: true
      user_id:
        type: slack#/types/user_id
        title: Asked by
        description: Who the request is from (usually "Person who used this workflow"); checked like any request
        is_required: true
      request:
        type: string
        title: Request
        description: What Scout should do
        is_required: true
      about:
        type: string
        title: Context
        description: Anything Scout should know (a form's answers, an alert)
    output_parameters:
      thread_link:
        type: string
        title: Thread link
        description: The Slack thread where Scout is working
        is_required: true
settings:
  function_runtime: remote
  event_subscriptions:
    bot_events:
      - message.channels
      - message.groups
      - message.im
      - message.mpim
      - reaction_added
      - app_home_opened
      - link_shared
      - function_executed # the Ask Scout workflow step ran
  interactivity:
    is_enabled: true
  org_deploy_enabled: true # Slack requires it for apps with workflow steps; no effect outside Enterprise Grid
  socket_mode_enabled: true
  token_rotation_enabled: false
