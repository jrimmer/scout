# Scout's nightly canary: ask Scout for a small change in Slack, as a person would, and check a pull request comes of
# it (npm run canary; docs/operations.md, "The canary"). It does nothing until its secrets are set.
name: canary

on:
  schedule:
    - cron: "0 13 * * *"
  workflow_dispatch:

jobs:
  canary:
    runs-on: scout
    env:
      SCOUT_CANARY_SLACK_TOKEN: ${{ secrets.SCOUT_CANARY_SLACK_TOKEN }}
      SCOUT_CANARY_CODEHOST_TOKEN: ${{ secrets.SCOUT_CANARY_CODEHOST_TOKEN }}
      SCOUT_CANARY_REPORT_TOKEN: ${{ secrets.SCOUT_CANARY_REPORT_TOKEN }}
      SCOUT_CANARY_CHANNEL: ${{ vars.SCOUT_CANARY_CHANNEL }}
      SCOUT_CANARY_SCOUT_USER: ${{ vars.SCOUT_CANARY_SCOUT_USER }}
      SCOUT_CANARY_REPO: ${{ vars.SCOUT_CANARY_REPO }}
      SCOUT_CANARY_REPORT_URL: ${{ vars.SCOUT_CANARY_REPORT_URL }}
      SCOUT_CODEHOST: ${{ vars.SCOUT_CODEHOST }}
      SCOUT_CODEHOST_API: ${{ vars.SCOUT_CODEHOST_API }}
    steps:
      - uses: actions/checkout@v4
      - name: Node
        run: |
          file=$(curl -fsSL "https://nodejs.org/dist/latest-v24.x/SHASUMS256.txt" | awk '/linux-x64.tar.xz$/ {print $2}')
          curl -fsSL "https://nodejs.org/dist/latest-v24.x/$file" | tar -xJ -C /usr/local --strip-components=1
      - run: npm ci --no-audit --no-fund --omit=dev
      - name: Canary
        run: |
          if [ -z "$SCOUT_CANARY_SLACK_TOKEN" ]; then echo "The canary isn't set up yet (no SCOUT_CANARY_SLACK_TOKEN secret)."; exit 0; fi
          npm run canary
