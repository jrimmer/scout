# Type checks and tests on every push to main and every pull request, on Scout's own runner (a fresh spoond microVM per job).
# Nothing waits on it: a pull request is tested merged with the latest main, and main is tested again after each push,
# so whoever merges or deploys can see whether main builds before and after.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: scout
    steps:
      - uses: actions/checkout@v4
      - name: Merged with main
        # A pull request is tested as main would be after merging it; on main itself this changes nothing.
        run: |
          if [ -f .git/shallow ]; then git fetch -q --unshallow origin; fi
          git fetch -q origin main
          git -c user.name=ci -c user.email=ci@localhost merge -q --no-edit FETCH_HEAD
          git log --oneline -1
      - name: Node
        run: |
          file=$(curl -fsSL "https://nodejs.org/dist/latest-v24.x/SHASUMS256.txt" | awk '/linux-x64.tar.xz$/ {print $2}')
          curl -fsSL "https://nodejs.org/dist/latest-v24.x/$file" | tar -xJ -C /usr/local --strip-components=1
          node --version
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm test

  docker:
    runs-on: scout
    steps:
      - uses: actions/checkout@v4
      - name: Merged with main
        # A pull request is tested as main would be after merging it; on main itself this changes nothing.
        run: |
          if [ -f .git/shallow ]; then git fetch -q --unshallow origin; fi
          git fetch -q origin main
          git -c user.name=ci -c user.email=ci@localhost merge -q --no-edit FETCH_HEAD
          git log --oneline -1
      - name: Node and Docker
        run: |
          file=$(curl -fsSL "https://nodejs.org/dist/latest-v24.x/SHASUMS256.txt" | awk '/linux-x64.tar.xz$/ {print $2}')
          curl -fsSL "https://nodejs.org/dist/latest-v24.x/$file" | tar -xJ -C /usr/local --strip-components=1
          apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq docker.io >/dev/null
          (dockerd >/tmp/dockerd.log 2>&1 &)
          for i in $(seq 30); do docker info >/dev/null 2>&1 && break; sleep 1; done
          docker version --format 'docker {{.Server.Version}}'
      - run: npm ci --no-audit --no-fund
      - run: docker build -q -t scout-sandbox:latest sandbox
      - name: Docker sandbox tests
        run: SCOUT_DOCKER_TESTS=1 node --test test/docker.test.ts
