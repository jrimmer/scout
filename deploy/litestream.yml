# Continuous replication of Scout's state to object storage, so losing the host loses seconds, not threads.
# Both databases are SQLite in WAL mode, which is what Litestream needs. Restore on a new host and Pi Durable resumes
# every unfinished run. See docs/operations.md.
#
# LITESTREAM_REPLICA_URL: e.g. s3://scout-backups/prod, or a path for a quick local test. Credentials come from the
# usual LITESTREAM_ACCESS_KEY_ID / LITESTREAM_SECRET_ACCESS_KEY (or AWS_*) variables.
dbs:
  - path: ${SCOUT_DATA_DIR}/pi.sqlite # conversations: transcripts, tasks, checkpoints
    replicas:
      - url: ${LITESTREAM_REPLICA_URL}/pi
        retention: 168h
  - path: ${SCOUT_DATA_DIR}/scout.sqlite # threads, pull requests, notes, search, audit
    replicas:
      - url: ${LITESTREAM_REPLICA_URL}/scout
        retention: 168h
