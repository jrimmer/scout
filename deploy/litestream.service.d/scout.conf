# A drop-in for the litestream.service that Litestream's package installs: it replicates Scout's databases
# (/etc/litestream.yml, from deploy/litestream.yml) as Scout's user, so it can read them and write its directory beside
# each one (.pi.sqlite-litestream), which Scout's backup check looks for.
#
# Install: copy to /etc/systemd/system/litestream.service.d/scout.conf. Make the credentials file, readable by root
# alone (`sudo install -m 600 /dev/null /etc/litestream.env`), and put the replica's keys in it:
#
#   LITESTREAM_ACCESS_KEY_ID=...
#   LITESTREAM_SECRET_ACCESS_KEY=...
#
# Scout's unit reads it too, for its restore on a new host. Then `systemctl daemon-reload` and
# `systemctl enable --now litestream`.
[Service]
User=scout
EnvironmentFile=/etc/litestream.env
